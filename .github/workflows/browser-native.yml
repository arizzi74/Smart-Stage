name: Browser controls against published native binaries
on:
  push:
    branches: [main]
    paths: ['scripts/browser-native-smoke.cjs', 'scripts/browser/**', 'install.sh', 'install.ps1', '.github/workflows/browser-native.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Published release tag; empty uses the installer default'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        required: false
        type: string
permissions:
  contents: read
jobs:
  browser:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: windows-2025
            os: windows
            arch: amd64
          - runner: windows-11-arm
            os: windows
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      SMARTSTAGE_VERSION: ${{ inputs.version }}
      SMARTSTAGE_INSTALL_DIR: ${{ github.workspace }}/dist/browser-installed
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install published macOS executable
        if: runner.os == 'macOS'
        shell: bash
        run: sh install.sh
      - name: Install published Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& ./install.ps1'
      - name: Install pinned development-only browser tools
        shell: bash
        run: |
          node --version
          npm ci --prefix scripts/browser --ignore-scripts --no-audit --no-fund
          node scripts/browser/node_modules/playwright/cli.js install chromium
      - name: Exercise real Admin and Command through the published native host
        shell: bash
        run: |
          suffix=''
          if [[ '${{ matrix.os }}' == windows ]]; then suffix=.exe; fi
          node scripts/browser-native-smoke.cjs "$SMARTSTAGE_INSTALL_DIR/smartstage$suffix"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-native-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/browser-native/
          if-no-files-found: warn
