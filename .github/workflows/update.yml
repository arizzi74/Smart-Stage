name: Verify automatic updates against published native releases
on:
  push:
    branches: [main]
    paths: ['scripts/verify-auto-update.py', 'scripts/macos_app_checks.py', 'scripts/windows_app_checks.py', '.github/workflows/update.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Published release to verify'
        required: true
        type: string
        default: 'v0.1.0-preview.21'
      fixture-run:
        description: 'Tagged build run containing the older-version fixtures'
        required: true
        type: string
        default: '35616207921'
      fixture-source:
        description: 'Expected source commit of the published release and fixtures'
        required: true
        type: string
        default: 'acac0468bd03e1a51a16774542d22a98b4e5b94d'
  workflow_call:
    inputs:
      version:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  update:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: windows-2025
            os: windows
            arch: amd64
          - runner: windows-11-arm
            os: windows
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: update-fixture-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/update-fixture
          run-id: ${{ inputs.fixture-run || (github.event_name == 'push' && github.ref == 'refs/heads/main' && '35616207921') || github.run_id }}
          github-token: ${{ github.token }}
      - name: Ensure the Windows dedicated-window runtime
        if: matrix.os == 'windows'
        shell: pwsh
        run: ./scripts/ensure-webview2.ps1
      - name: Exercise real automatic discovery, replacement and restart
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version || 'v0.1.0-preview.21' }}
          FIXTURE_SOURCE: ${{ inputs.fixture-source || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'acac0468bd03e1a51a16774542d22a98b4e5b94d') || github.sha }}
        run: |
          python3 scripts/verify-auto-update.py --version "$RELEASE_VERSION" \
            --os '${{ matrix.os }}' --arch '${{ matrix.arch }}' \
            --fixture-source "$FIXTURE_SOURCE" \
            --fixture dist/update-fixture --output 'dist/auto-update/${{ matrix.os }}-${{ matrix.arch }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: auto-update-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/auto-update/**/*.json
            dist/auto-update/**/*.log
          if-no-files-found: warn
