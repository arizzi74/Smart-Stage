name: Build and test native targets
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', 'README.md', 'IMPLEMENTATION_STATUS.md', 'install.sh', 'install.ps1', '.github/workflows/install.yml', '.github/workflows/soak.yml', '.github/workflows/browser-native.yml', 'scripts/browser-native-smoke.cjs', 'scripts/browser/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: windows-2025
            os: windows
            arch: amd64
            toolchain: x86_64
            sha256: 1bcf74d06b724aeecaa6412ca85f5b26fb1da770e7cdcefa9263c9c5c3ad34b6
          - runner: windows-11-arm
            os: windows
            arch: arm64
            toolchain: aarch64
            sha256: 7fe35f60407473c420ac72b25137f54385b0affd2c42efd507c0062fc626ab56
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache: false
      - name: Install pinned native Windows build toolchain
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          TOOLCHAIN_ARCH: ${{ matrix.toolchain }}
          TOOLCHAIN_SHA256: ${{ matrix.sha256 }}
        run: |
          $name = "llvm-mingw-20260908-ucrt-$env:TOOLCHAIN_ARCH"
          $archive = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/20260908/$name.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:TOOLCHAIN_SHA256) { throw 'Toolchain checksum mismatch' }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP "$name/bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build and inspect native imports
        shell: bash
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
        run: bash scripts/build.sh '${{ matrix.os }}' '${{ matrix.arch }}'
      - name: Shared tests on target OS
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: go test ./...
      - name: Native executable startup
        shell: bash
        run: |
          suffix=''
          if [[ '${{ matrix.os }}' == windows ]]; then suffix=.exe; fi
          "./dist/native-harness-${{ matrix.os }}-${{ matrix.arch }}$suffix" --version
          "./dist/native-harness-${{ matrix.os }}-${{ matrix.arch }}$suffix" --list > "dist/native-enumeration-${{ matrix.os }}-${{ matrix.arch }}.json"
          python3 scripts/native-smoke.py "./dist/native-harness-${{ matrix.os }}-${{ matrix.arch }}$suffix"
          python3 scripts/application-smoke.py "./dist/smartstage-${{ matrix.os }}-${{ matrix.arch }}$suffix"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [shared, native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-*
          merge-multiple: true
          path: dist
      - name: Publish verified builds as a preview
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/smartstage-* dist/toolchain-* dist/native-enumeration-* dist/native-harness-*.smoke.json \
            --verify-tag --prerelease --title "Smart Stage $RELEASE_TAG" --notes-file docs/release-notes.md
  verify-install:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Install the published Mac binary using curl
        if: runner.os == 'macOS'
        shell: bash
        env:
          SMARTSTAGE_VERSION: ${{ github.ref_name }}
          SMARTSTAGE_INSTALL_DIR: ${{ runner.temp }}/smartstage-installed
        run: |
          curl -fsSL https://raw.githubusercontent.com/arizzi74/Smart-Stage/main/install.sh | sh
          "$SMARTSTAGE_INSTALL_DIR/smartstage" --version
          "$SMARTSTAGE_INSTALL_DIR/smartstage" --port 18787 --bind 127.0.0.1 --config-dir "$RUNNER_TEMP/smartstage-installed-config" > "$RUNNER_TEMP/smartstage-installed.log" 2>&1 &
          app_pid=$!
          trap 'kill -INT "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:18787/command -o "$RUNNER_TEMP/command.html"; then break; fi
            sleep 1
          done
          grep -q 'Smart Stage' "$RUNNER_TEMP/command.html"
          kill -INT "$app_pid"
          wait "$app_pid"
      - name: Install the published Windows binary using irm
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SMARTSTAGE_VERSION: ${{ github.ref_name }}
          SMARTSTAGE_INSTALL_DIR: ${{ runner.temp }}/smartstage-installed
        run: |
          irm https://raw.githubusercontent.com/arizzi74/Smart-Stage/main/install.ps1 | iex
          $exe = Join-Path $env:SMARTSTAGE_INSTALL_DIR 'smartstage.exe'
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed binary version check failed' }
          $config = Join-Path $env:RUNNER_TEMP 'smartstage-installed-config'
          $appProcess = Start-Process -FilePath $exe -ArgumentList "--port 18787 --bind 127.0.0.1 --config-dir `"$config`"" -PassThru -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'installed.log') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'installed-error.log')
          try {
            $ok = $false
            for ($attempt=0; $attempt -lt 30; $attempt++) {
              try { $page = (Invoke-WebRequest http://127.0.0.1:18787/command).Content; $ok = $page -match 'Smart Stage'; if ($ok) { break } } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ok) { throw 'Installed application did not serve Command' }
          } finally { Stop-Process -Id $appProcess.Id -ErrorAction SilentlyContinue }
  verify-browser:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/browser-native.yml
    with:
      version: ${{ github.ref_name }}
