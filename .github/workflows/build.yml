name: Build and test native targets
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', 'README.md', 'IMPLEMENTATION_STATUS.md', 'install.sh', 'scripts/verify-macos-install.py', '.github/workflows/install-macos.yml', '.github/workflows/downloads.yml', '.github/workflows/soak.yml', '.github/workflows/browser-native.yml', '.github/workflows/windows-audio.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: node --test scripts/wake-lock.test.cjs
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: windows-2025
            os: windows
            arch: amd64
            toolchain: x86_64
            sha256: 1bcf74d06b724aeecaa6412ca85f5b26fb1da770e7cdcefa9263c9c5c3ad34b6
          - runner: windows-11-arm
            os: windows
            arch: arm64
            toolchain: aarch64
            sha256: 7fe35f60407473c420ac72b25137f54385b0affd2c42efd507c0062fc626ab56
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache: false
      - name: Install pinned native Windows build toolchain
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          TOOLCHAIN_ARCH: ${{ matrix.toolchain }}
          TOOLCHAIN_SHA256: ${{ matrix.sha256 }}
        run: |
          $name = "llvm-mingw-20260908-ucrt-$env:TOOLCHAIN_ARCH"
          $archive = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/20260908/$name.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:TOOLCHAIN_SHA256) { throw 'Toolchain checksum mismatch' }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP "$name/bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build and inspect native imports
        shell: bash
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
        run: bash scripts/build.sh '${{ matrix.os }}' '${{ matrix.arch }}'
      - name: Shared tests on target OS
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: go test ./...
      - name: Native executable startup
        shell: bash
        run: |
          suffix=''
          if [[ '${{ matrix.os }}' == windows ]]; then suffix=.exe; fi
          "./dist/native-harness-${{ matrix.os }}-${{ matrix.arch }}$suffix" --version
          "./dist/native-harness-${{ matrix.os }}-${{ matrix.arch }}$suffix" --list > "dist/native-enumeration-${{ matrix.os }}-${{ matrix.arch }}.json"
          python3 scripts/native-smoke.py "./dist/native-harness-${{ matrix.os }}-${{ matrix.arch }}$suffix"
          python3 scripts/application-smoke.py "./dist/smartstage-${{ matrix.os }}-${{ matrix.arch }}$suffix" 10
      - name: Verify the ZIP, automatic system browser launch and local Admin
        shell: bash
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
        run: |
          python3 scripts/verify-download.py --version "$VERSION" --os '${{ matrix.os }}' --arch '${{ matrix.arch }}' \
            --archive 'dist/smartstage-${{ matrix.os }}-${{ matrix.arch }}.zip' \
            --destination 'dist/extracted-${{ matrix.os }}-${{ matrix.arch }}' --smoke
      - name: Verify embedded icon and optional Finder app
        shell: bash
        run: |
          if [[ '${{ matrix.os }}' == darwin ]]; then
            python3 scripts/verify-icons.py './dist/smartstage-darwin-${{ matrix.arch }}' --finder-launch
          else
            python3 scripts/verify-icons.py './dist/smartstage-windows-${{ matrix.arch }}.exe'
          fi
      - name: Install pinned development-only browser tools
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          node --version
          npm ci --prefix scripts/browser --ignore-scripts --no-audit --no-fund
          node scripts/browser/node_modules/playwright/cli.js install chromium
      - name: Exercise Admin and remote controls through the built native host
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        timeout-minutes: 10
        shell: bash
        run: |
          suffix=''
          if [[ '${{ matrix.os }}' == windows ]]; then suffix=.exe; fi
          node scripts/browser-native-smoke.cjs "./dist/smartstage-${{ matrix.os }}-${{ matrix.arch }}$suffix"
      - name: Build an isolated older-version fixture for automatic update verification
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: bash scripts/build-update-fixture.sh '${{ matrix.os }}' '${{ matrix.arch }}' '${{ runner.temp }}/smartstage-update-fixture-${{ matrix.os }}-${{ matrix.arch }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: update-fixture-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/smartstage-update-fixture-${{ matrix.os }}-${{ matrix.arch }}/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [shared, native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-*
          merge-multiple: true
          path: dist
      - name: Publish verified builds as a preview
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/smartstage-*.zip dist/smartstage-*.zip.sha256 \
            dist/smartstage-*.imports.txt dist/smartstage-*.icon.json dist/smartstage-*.http-smoke.json \
            dist/toolchain-* dist/native-enumeration-* dist/native-harness-*.smoke.json \
            --verify-tag --prerelease --title "Smart Stage $RELEASE_TAG" --notes-file docs/release-notes.md
      - name: Mark the failed preview 9 updater as superseded
        if: github.ref_name == 'v0.1.0-preview.10'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat <<'NOTICE'
          **Superseded by [preview 10](https://github.com/arizzi74/Smart-Stage/releases/tag/v0.1.0-preview.10).**

          Preview 9's updater rejects optimized release binaries before replacing any files. Install preview 10 once using its Mac installer or matching ZIP to enable working automatic updates. Saved shows are preserved. The default Mac installer was never switched to preview 9.

          ---

          NOTICE
            gh release view v0.1.0-preview.9 --json body --jq .body
          } > "$RUNNER_TEMP/preview9-superseded.md"
          gh release edit v0.1.0-preview.9 --title 'Smart Stage v0.1.0-preview.9 (superseded)' --notes-file "$RUNNER_TEMP/preview9-superseded.md"
  verify-download:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/downloads.yml
    with:
      version: ${{ github.ref_name }}
  verify-browser:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/browser-native.yml
    with:
      version: ${{ github.ref_name }}
  verify-macos-install:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/install-macos.yml
    with:
      version: ${{ github.ref_name }}
  verify-update:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/update.yml
    with:
      version: ${{ github.ref_name }}
