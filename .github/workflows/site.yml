name: Publish Smart Stage website

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'docs/screenshots/**'
      - 'assets/icon/**'
      - 'scripts/build-site.py'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'docs/site/**'
      - 'docs/screenshots/**'
      - 'assets/icon/**'
      - 'scripts/build-site.py'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build static website
        run: python3 scripts/build-site.py
      - name: Upload website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: dist/site
  configuration:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check Pages activation
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" > "$RUNNER_TEMP/pages.json"; then
            if jq -e '.build_type == "workflow"' "$RUNNER_TEMP/pages.json" > /dev/null; then
              echo 'enabled=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'enabled=false' >> "$GITHUB_OUTPUT"
          echo '::notice::Website built but not published. Enable Settings > Pages > Source: GitHub Actions, then run this workflow.'
          echo 'Website deployment is waiting for **Settings → Pages → Source: GitHub Actions**. Once enabled, use **Run workflow** on this workflow. Future website changes publish automatically.' >> "$GITHUB_STEP_SUMMARY"
  deploy:
    if: needs.configuration.outputs.enabled == 'true'
    needs: [build, configuration]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Deploy public website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
