name: Candidate native Mac display pixels
on:
  push:
    branches: [main]
    paths: ['.github/workflows/native-display.yml', 'scripts/native-display-smoke.py', 'scripts/pixel-count.go']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  display:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache: false
      - name: Download exact candidate native harness from its successful build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: '35478340978'
          name: native-darwin-${{ matrix.arch }}
          path: dist/target-build
      - name: Build development-only PNG pixel analyzer
        run: go build -o dist/pixel-count scripts/pixel-count.go
      - name: Capture actual native video, STOP, restart and natural end
        run: |
          chmod +x dist/target-build/native-harness-darwin-${{ matrix.arch }}
          python3 scripts/native-display-smoke.py dist/target-build/native-harness-darwin-${{ matrix.arch }} dist/pixel-count dist/native-display-${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-display-darwin-${{ matrix.arch }}
          path: dist/native-display-${{ matrix.arch }}/
          if-no-files-found: warn
