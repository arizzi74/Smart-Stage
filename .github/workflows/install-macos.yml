name: Verify Mac app installation and quarantine removal
on:
  push:
    branches: [main]
    paths: ['install.sh', 'scripts/verify-macos-install.py', '.github/workflows/install-macos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install the published app, clear only its quarantine, and launch Admin
        run: |
          python3 scripts/verify-macos-install.py --installer install.sh \
            --version v0.1.0-preview.6 --launch \
            --output 'dist/macos-install/${{ matrix.arch }}/result.json'
      - name: Retain installation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-app-install-${{ matrix.arch }}
          path: dist/macos-install/
          if-no-files-found: warn
