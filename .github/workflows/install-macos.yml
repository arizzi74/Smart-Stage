name: Verify Mac app installation and quarantine removal
on:
  push:
    branches: [main]
    paths: ['install.sh', 'scripts/verify-macos-install.py', 'scripts/macos_app_checks.py', 'scripts/inspect-macos-app.m', '.github/workflows/install-macos.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag; leave empty to verify the installer default'
        type: string
        required: false
  workflow_call:
    inputs:
      version:
        description: 'Published release tag to install and launch'
        type: string
        required: true
permissions:
  contents: read
jobs:
  install:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install the published app, clear only its quarantine, and launch Admin
        env:
          RELEASE_VERSION: ${{ inputs.version || '' }}
        run: |
          python3 scripts/verify-macos-install.py --installer install.sh \
            --version "$RELEASE_VERSION" --launch \
            --bootstrap-url 'https://raw.githubusercontent.com/arizzi74/Smart-Stage/${{ github.sha }}/install.sh' \
            --output 'dist/macos-install/${{ matrix.arch }}/result.json'
      - name: Retain installation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-app-install-${{ matrix.arch }}
          path: dist/macos-install/
          if-no-files-found: warn
