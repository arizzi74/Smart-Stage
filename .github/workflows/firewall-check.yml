name: Verify scoped Windows firewall rules
on:
  push:
    branches: [main]
    paths:
      - 'internal/update/firewall*'
      - 'internal/update/helper_windows.go'
      - '.github/workflows/firewall-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firewall:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: false
      - name: Create, read back and remove only scoped test rules
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          SMARTSTAGE_TEST_FIREWALL: '1'
        run: go test -count=1 -run '^TestWindowsLANFirewallRuleScoped$' -v ./internal/update
