<!doctype html>
<html lang="it">
<meta charset="utf-8">
<title>Smart Stage — immagine di condivisione</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: #101519; color: #f4f7f6; font-family: Arial, Helvetica, sans-serif; }
  .frame { position: relative; width: 100%; height: 100%; padding: 54px 64px; background: radial-gradient(ellipse at 90% 10%, #224337 0, transparent 50%); }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 27px; font-weight: 700; letter-spacing: -.6px; }
  .brand img { width: 54px; height: 54px; }
  .copy { position: relative; width: 720px; z-index: 2; }
  .eyebrow { margin: 46px 0 18px; color: #a6dbc7; text-transform: uppercase; letter-spacing: 3px; font-size: 16px; font-weight: 700; }
  h1 { font-size: 68px; line-height: 1.06; letter-spacing: -3px; margin: 0 0 24px; font-weight: 750; }
  .description { margin: 0; max-width: 650px; font-size: 25px; line-height: 1.48; color: #c3cfca; }
  .platforms { display: flex; gap: 12px; margin-top: 30px; }
  .platforms span { padding: 10px 16px; border: 1px solid #456158; border-radius: 8px; color: #dcf2e8; font-size: 17px; }
  .address { position: absolute; bottom: 40px; left: 64px; color: #98afa5; font-size: 17px; }
  .remote { position: absolute; width: 294px; top: 37px; right: 69px; border: 1px solid #40584e; border-radius: 22px; box-shadow: 0 25px 50px #0008; }
</style>
<div class="frame">
  <div class="copy">
    <div class="brand"><img src="../../assets/icon/smartstage.png" alt="">Smart Stage</div>
    <p class="eyebrow">Controllo dello spettacolo</p>
    <h1>Il tuo spettacolo.<br>A portata di mano.</h1>
    <p class="description">Riproduci audio, video e immagini sul computer. Controlla il palco da telefono o tablet.</p>
    <div class="platforms"><span>macOS</span><span>Windows</span><span>ARM64 + Intel / AMD64</span></div>
  </div>
  <img class="remote" src="../../docs/screenshots/remote.png" alt="Comandi remoti di Smart Stage con contenuti di esempio">
  <span class="address">github.com/arizzi74/Smart-Stage</span>
</div>
</html>
